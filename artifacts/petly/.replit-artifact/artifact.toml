kind = "web"
previewPath = "/"
title = "Petly - Pet Care Platform"
version = "1.0.0"
id = "artifacts/petly"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21722

[services.development]
run = "pnpm --filter @workspace/petly run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/petly", "run", "build" ]
publicDir = "artifacts/petly/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21722"
BASE_PATH = "/"
